<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Model Viewer</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #start-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('start.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        z-index: 1000;
        cursor: pointer;
        transition: opacity 0.5s ease-out;
      }
      #start-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #start-button {
        position: fixed;
        bottom: 25%;
        left: 50%;
        transform: translate(-50%, 0);
        width: 260px;
        height: auto;
        z-index: 1001;
        cursor: pointer;
        animation: float 1s ease-in-out infinite;
      }
      #start-button:hover {
        animation-play-state: paused;
      }
      #rules-image {
        position: fixed;
        top: 5%;
        left: 50%;
        transform: translateX(-50%);
        width: 50%;
        height: auto;
        z-index: 2000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s ease-in-out;
        cursor: pointer;
      }
      #rules-image.visible {
        opacity: 1;
        pointer-events: auto;
      }
      @keyframes float {
        0%, 100% {
          transform: translate(-50%, 0);
        }
        50% {
          transform: translate(-50%, -4px);
        }
      }
      #game-container {
        opacity: 0;
        transition: opacity 0.5s ease-in;
      }
      #game-container.visible {
        opacity: 1;
      }
      #color-background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #000000;
        z-index: 0;
      }
      #bg-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        background-image: url('bg.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        z-index: 1;
      }
      canvas {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        pointer-events: auto;
      }
      .top-right-image {
        position: fixed;
        top: 10px;
        right: 20px;
        width: 420px;
        height: auto;
        z-index: 3;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
      }
      #wind-progress-container {
        position: fixed;
        top: 10px;
        right: 20px;
        width: 420px;
        height: auto;
        z-index: 2;
        display: none;
      }
      #wind-progress-bar {
        position: absolute;
        top: 28%;
        left: 8%;
        width: 0%;
        height: 22%;
        background-color: white;
        border-radius: 999px;
        transition: width 0.1s linear;
      }
      .top-left-image {
        position: fixed;
        top: 10px;
        left: 20px;
        width: 420px;
        height: auto;
        z-index: 3;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
      }
      #left-white-bg {
        position: fixed;
        top: 55px;
        left: 20px;
        width: 411.6px;
        height: 4%;
        z-index: 2;
        background-color: rgba(255, 255, 255, 0.2);
        pointer-events: none;
        border-radius: 8px;
        overflow: hidden;
      }
      #progress-fill {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 20%;
        background-color: #FFFFFF;
        border-radius: 8px;
        transition: width 0.1s linear;
      }
      #right-white-bg {
        position: fixed;
        top: 55px;
        right: 20px;
        width: 411.6px;
        height: 4%;
        z-index: 2;
        background-color: rgba(255, 255, 255, 0.2);
        pointer-events: none;
        border-radius: 8px;
        overflow: hidden;
      }
      #right-progress-fill {
        position: absolute;
        top: 0;
        right: 0;
        height: 100%;
        width: 20%;
        background-color: #FFFFFF;
        border-radius: 8px;
        transition: width 0.1s linear;
      }
    </style>
  </head>
  <body>
    <audio id="background-music" loop>
      <source src="music.mp3" type="audio/mpeg">
    </audio>
    <div id="start-screen"></div>
    <img id="start-button" src="button.png" alt="Start Button">
    <img id="rules-image" src="rules.png" alt="Game Rules">
    <div id="game-container">
      <div id="color-background"></div>
      <div id="bg-overlay"></div>
      <div id="left-white-bg">
        <div id="progress-fill"></div>
      </div>
      <div id="right-white-bg">
        <div id="right-progress-fill"></div>
      </div>
      <img src="left.png" alt="Left" class="top-left-image">
      <div id="wind-progress-container">
        <div id="wind-progress-bar"></div>
      </div>
      <img src="right.png" alt="Right" class="top-right-image">
    </div>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="main.js"></script>
    <script>
      // Background music setup
      const backgroundMusic = document.getElementById('background-music');
      backgroundMusic.volume = 0.6; // Set volume to 60%

      // Function to start background music
      function startBackgroundMusic() {
        backgroundMusic.play().catch(error => {
          console.log('Autoplay prevented:', error);
        });
      }

      // Try to start music immediately
      startBackgroundMusic();

      // Start screen transition logic
      const startScreen = document.getElementById('start-screen');
      const startButton = document.getElementById('start-button');
      const gameContainer = document.getElementById('game-container');
      const rulesImage = document.getElementById('rules-image');
      let gameStarted = false;
      let finalScreenShown = false;

      // Add click listener to start screen for music
      startScreen.addEventListener('click', startBackgroundMusic);

      // Track sun progress bar fill
      function checkSunProgress() {
        const rightProgressFill = document.getElementById('right-progress-fill');
        const container = rightProgressFill.parentElement;
        const fillWidth = rightProgressFill.getBoundingClientRect().width;
        const totalWidth = container.getBoundingClientRect().width;
        const progress = (fillWidth / totalWidth) * 100;
        
        if (progress >= 99 && !finalScreenShown) {
          finalScreenShown = true;
          const finalVideo = document.createElement('video');
          finalVideo.src = 'final.mp4';
          finalVideo.style.position = 'fixed';
          finalVideo.style.top = '0';
          finalVideo.style.left = '0';
          finalVideo.style.width = '100vw';
          finalVideo.style.height = '100vh';
          finalVideo.style.objectFit = 'cover';
          finalVideo.style.zIndex = '9999';
          finalVideo.autoplay = true;
          finalVideo.muted = true;
          finalVideo.loop = true;
          document.body.appendChild(finalVideo);
        }
      }

      // Set up progress monitoring interval
      setInterval(checkSunProgress, 100);

      function showRules() {
        if (gameStarted) return;
        gameStarted = true;
        
        // Fade out start screen and button
        startScreen.classList.add('fade-out');
        startButton.style.opacity = '0';
        startButton.style.transition = 'opacity 0.5s ease-out';
        
        // Show game container first
        gameContainer.classList.add('visible');
        
        // Show rules image
        rulesImage.classList.add('visible');
      }

      function startGame() {
        // Hide rules image
        rulesImage.classList.remove('visible');
        
        // Trigger game initialization
        window.dispatchEvent(new Event('startGame'));
        
        // Remove start screen and button after fade
        setTimeout(() => {
          startScreen.remove();
          startButton.remove();
        }, 500);
      }

      // Add click listeners
      startButton.addEventListener('click', showRules);
      rulesImage.addEventListener('click', startGame);
    </script>
  </body>
</html>
